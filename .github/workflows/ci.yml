name: Test & build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  core-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm run wasm
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
  android:
    needs: core-and-web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mise-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: android/app/build/reports/androidTests
  ios:
    needs: core-and-web
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - run: npx cap sync ios
      - name: Build for iOS simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Boot simulator and launch the application
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/simulator/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.mise.restaurant
          xcrun simctl io "$DEVICE" screenshot build/ios-simulator.png
      - name: Archive unsigned iPhone application
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Mise.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Package unsigned IPA (requires signing before installation)
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/Mise.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa
          zip -qr ../Mise-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: mise-ios-unsigned-ipa
          path: build/Mise-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mise-ios-simulator
          path: |
            build/simulator/Build/Products/Debug-iphonesimulator/App.app
            build/ios-simulator.png
